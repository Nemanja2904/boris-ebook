<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<title>Konsultacija - Boris Vasić</title>
<!-- Kratak link iz PDF-ova i sveske (borisprproj.com/konsultacija/?s=recept): vodi na checkout konsultacije sa izvorom. -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var s = q.get('s') || 'link';
  q.delete('s');
  q.set('p', 'konsultacija');
  if (!q.get('utm_source')) q.set('utm_source', s === 'link' ? 'link' : 'prirucnik');
  if (!q.get('utm_campaign')) q.set('utm_campaign', s);
  location.replace('/kupi/?' + q.toString());
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=/kupi/?p=konsultacija"></noscript>
</head>

</html>
